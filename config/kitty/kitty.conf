# Nothing palette. No matugen include: colours stay with the rice.

font_family      JetBrainsMono Nerd Font
font_size 11.0

cursor_shape beam
cursor_trail 1
cursor #d71921
cursor_text_color #0b0b0b

# Same padding idea as the II foot/kitty configs (≈22px).
window_margin_width 22
confirm_os_window_close 0
shell fish
wayland_titlebar_color background
window_padding_width 0
remember_window_size yes

foreground #c4c4c4
background #0b0b0b
selection_foreground #ffffff
selection_background #212121
url_color #8a8a8a

# Black / bright black
color0  #0b0b0b
color8  #454545
# Red
color1  #d71921
color9  #ff4d4d
# The rest stay grey so the terminal matches the shell, not a rainbow.
color2  #8a8a8a
color10 #c4c4c4
color3  #c4c4c4
color11 #ffffff
color4  #6e6e6e
color12 #c4c4c4
color5  #8a8a8a
color13 #c4c4c4
color6  #8a8a8a
color14 #c4c4c4
color7  #c4c4c4
color15 #ffffff

map ctrl+c    copy_or_interrupt
map ctrl+f    launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id
map kitty_mod+f launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id
map page_up    scroll_page_up
map page_down  scroll_page_down
map ctrl+plus  change_font_size all +1
map ctrl+equal change_font_size all +1
map ctrl+kp_add change_font_size all +1
map ctrl+minus change_font_size all -1
map ctrl+underscore change_font_size all -1
map ctrl+kp_subtract change_font_size all -1
map ctrl+0     change_font_size all 0
map ctrl+kp_0  change_font_size all 0
