# ═══════════════════════════════════════════════════════════════════════
#  NOTHING - idle
#  Started by hypr/hyprland/execs.lua: hypridle -c <this file>
# ═══════════════════════════════════════════════════════════════════════

# Lock with the repo theme, and never twice if already locked.
# NOTHING_ROOT is set by hypr/hyprland/env.lua (hl.env) and by the launch
# scripts: the repo stays movable. The fallback covers a hypridle started
# by hand, outside the session.
$lock = pidof hyprlock || hyprlock -c ${NOTHING_ROOT:-$HOME/.config}/hypr/hyprlock.conf
$suspend = systemctl suspend || loginctl suspend

general {
    lock_cmd = $lock
    before_sleep_cmd = loginctl lock-session
    # inhibit_sleep = 3: wait until the locker is shown before
    # suspending, otherwise the screen briefly wakes unlocked.
    inhibit_sleep = 3
}

# 2 min: dim brightness, without locking
listener {
    timeout = 120
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# 5 min: lock
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 10 min: turn screens off
listener {
    timeout = 600
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'
}

# 20 min: suspend the machine
listener {
    timeout = 1200
    on-timeout = $suspend
}
