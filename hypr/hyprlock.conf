# ═══════════════════════════════════════════════════════════════════════
#  NOTHING - lock screen
#  Installed by scripts/install.sh to ~/.config/hypr/hyprlock.conf
# ═══════════════════════════════════════════════════════════════════════

# Same base as the status line: this rice runs from the clone.
$SCRIPTS = $HOME/hypr_nothing/scripts

general {
    # The session buttons are clickable, so the pointer has to exist.
    hide_cursor = false
    ignore_empty_input = true
    immediate_render = true
    fractional_scaling = 2
}

animations {
    enabled = true
    bezier = nothing, 0.16, 1.0, 0.30, 1.0
    animation = fadeIn,  1, 3, nothing
    animation = fadeOut, 1, 2, nothing
    animation = inputFieldDots, 1, 2, nothing
}

# ── Background ─────────────────────────────────────────────────────────
background {
    monitor =
    color = rgba(0b0b0bff)
    # The desktop background, heavily darkened and blurred
    path = screenshot
    blur_passes = 4
    blur_size = 8
    noise = 0.02
    contrast = 0.85
    brightness = 0.18
    vibrancy = 0.0
    vibrancy_darkness = 0.0
}

# ── Clock ──────────────────────────────────────────────────────────────
# One reading, big. The seconds used to sit under it in Ndot at half the
# size, which read as a second clock rather than a detail.
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(ffffffff)
    font_size = 164
    font_family = Ndot77JPExtended
    position = 0, 150
    halign = center
    valign = center
}

# ── Date ───────────────────────────────────────────────────────────────
# Tracked uppercase mono, the label voice used everywhere in the shell,
# rather than the sentence-case Inter it had.
label {
    monitor =
    text = cmd[update:60000] LC_TIME=en_GB.UTF-8 date +"%A %-d %B" | tr 'a-z' 'A-Z' | sed 's/\(.\)/\1 /g; s/ *$//'
    color = rgba(8a8a8aff)
    font_size = 11
    font_family = JetBrainsMono NF
    position = 0, 52
    halign = center
    valign = center
}

# ── The red dot, Nothing's signature ───────────────────────────────────
shape {
    monitor =
    size = 7, 7
    color = rgba(d71921ff)
    rounding = 4
    position = 0, 14
    halign = center
    valign = center
}

# ── Input field ────────────────────────────────────────────────────────
input-field {
    monitor =
    size = 292, 46
    outline_thickness = 1
    dots_size = 0.30
    dots_spacing = 0.34
    dots_center = true
    # Squares rather than the generic round bullet: closer to the Glyph
    # Matrix pitch, and bigger so each keystroke reads as a mark.
    # dots_rounding = -1 gives the round dots back.
    dots_rounding = 2

    # hyprlock can also draw a character per keystroke instead of a
    # shape. Left commented because I could not test it here and unparsed
    # markup would show as literal text:
    # dots_text_format = *

    outer_color = rgba(2a2a2aff)
    inner_color = rgba(161616ff)
    font_color = rgba(ffffffff)
    check_color = rgba(d71921ff)
    fail_color = rgba(d71921ff)

    fade_on_empty = false
    rounding = 14
    placeholder_text = <span foreground="##454545">Password</span>
    fail_text = <span foreground="##d71921">$FAIL  ·  $ATTEMPTS</span>
    hide_input = false

    position = 0, -56
    halign = center
    valign = center
}

# ── User ───────────────────────────────────────────────────────────────
label {
    monitor =
    text = $USER
    color = rgba(696969ff)
    font_size = 10
    font_family = JetBrainsMono NF
    position = 0, -100
    halign = center
    valign = center
}

# ── Session chips ──────────────────────────────────────────────────────
# Three chips closing the same column as the clock and the field, rather
# than three loose icons pushed to the screen edge. The shape is the
# frame, the label on top of it is what takes the click: shapes have no
# onclick, so the two are stacked by zindex.
#
# A click never acts. It arms an intent that scripts/lock.sh carries out
# only once hyprlock has exited cleanly, which happens on a correct
# password and nothing else.

shape {
    monitor =
    size = 46, 40
    color = rgba(161616ff)
    rounding = 13
    border_size = 1
    border_color = rgba(232323ff)
    position = -62, -172
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = cmd[update:300] $SCRIPTS/lock-action.sh icon logout
    onclick = $SCRIPTS/lock-action.sh toggle logout
    color = rgba(8a8a8aff)
    font_size = 17
    font_family = JetBrainsMono NF
    position = -62, -172
    halign = center
    valign = center
    zindex = 2
}

shape {
    monitor =
    size = 46, 40
    color = rgba(161616ff)
    rounding = 13
    border_size = 1
    border_color = rgba(232323ff)
    position = 0, -172
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = cmd[update:300] $SCRIPTS/lock-action.sh icon reboot
    onclick = $SCRIPTS/lock-action.sh toggle reboot
    color = rgba(8a8a8aff)
    font_size = 17
    font_family = JetBrainsMono NF
    position = 0, -172
    halign = center
    valign = center
    zindex = 2
}

shape {
    monitor =
    size = 46, 40
    color = rgba(161616ff)
    rounding = 13
    border_size = 1
    border_color = rgba(232323ff)
    position = 62, -172
    halign = center
    valign = center
    zindex = 1
}

label {
    monitor =
    text = cmd[update:300] $SCRIPTS/lock-action.sh icon shutdown
    onclick = $SCRIPTS/lock-action.sh toggle shutdown
    color = rgba(8a8a8aff)
    font_size = 17
    font_family = JetBrainsMono NF
    position = 62, -172
    halign = center
    valign = center
    zindex = 2
}

# What a press will do, and that it still needs the password. Always
# present: a silent row of icons would not explain itself.
label {
    monitor =
    text = cmd[update:300] $SCRIPTS/lock-action.sh status
    color = rgba(454545ff)
    font_size = 9
    font_family = JetBrainsMono NF
    position = 0, -212
    halign = center
    valign = center
}

# ── System line ────────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:30000] $HOME/hypr_nothing/hypr/lockstatus.sh
    color = rgba(454545ff)
    font_size = 10
    font_family = JetBrainsMono NF
    position = 0, 36
    halign = center
    valign = bottom
}
