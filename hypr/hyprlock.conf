# ═══════════════════════════════════════════════════════════════════════
#  NOTHING - lock screen
#  Installed by scripts/install.sh to ~/.config/hypr/hyprlock.conf
# ═══════════════════════════════════════════════════════════════════════

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
    fractional_scaling = 2
}

animations {
    enabled = true
    bezier = nothing, 0.16, 1.0, 0.30, 1.0
    animation = fadeIn,  1, 3, nothing
    animation = fadeOut, 1, 2, nothing
    animation = inputFieldDots, 1, 2, nothing
}

# ── Background ─────────────────────────────────────────────────────────
background {
    monitor =
    color = rgba(0b0b0bff)
    # The desktop background, heavily darkened and blurred
    path = screenshot
    blur_passes = 4
    blur_size = 8
    noise = 0.02
    contrast = 0.85
    brightness = 0.22
    vibrancy = 0.0
    vibrancy_darkness = 0.0
}

# ── Dot-matrix clock ───────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(ffffffff)
    font_size = 160
    font_family = Ndot77JPExtended
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] date +"%S"
    color = rgba(8a8a8aff)
    font_size = 34
    font_family = Ndot77JPExtended
    position = 0, 20
    halign = center
    valign = center
}

# ── Date ───────────────────────────────────────────────────────────────
label {
    monitor =
    text = cmd[update:60000] LC_TIME=en_GB.UTF-8 date +"%A %-d %B"
    color = rgba(ffffffff)
    font_size = 15
    font_family = Inter Variable
    position = 0, -30
    halign = center
    valign = center
}

# ── The red dot, Nothing's signature ───────────────────────────────────
shape {
    monitor =
    size = 8, 8
    color = rgba(d71921ff)
    rounding = 4
    position = 0, -66
    halign = center
    valign = center
}

# ── Input field ────────────────────────────────────────────────────────
input-field {
    monitor =
    size = 300, 46
    outline_thickness = 1
    dots_size = 0.22
    dots_spacing = 0.4
    dots_center = true
    dots_rounding = -1

    outer_color = rgba(2a2a2aff)
    inner_color = rgba(161616ff)
    font_color = rgba(ffffffff)
    check_color = rgba(d71921ff)
    fail_color = rgba(d71921ff)

    fade_on_empty = false
    rounding = 14
    placeholder_text = <span foreground="##8a8a8a">Password</span>
    fail_text = <span foreground="##d71921">$FAIL  ·  $ATTEMPTS</span>
    hide_input = false

    position = 0, -150
    halign = center
    valign = center
}

# ── User ───────────────────────────────────────────────────────────────
label {
    monitor =
    text = $USER
    color = rgba(8a8a8aff)
    font_size = 11
    font_family = JetBrainsMono NF
    position = 0, -200
    halign = center
    valign = center
}

# ── Bottom bar: battery, network, playback ─────────────────────────────
label {
    monitor =
    text = cmd[update:30000] $HOME/hypr_nothing/hypr/lockstatus.sh
    color = rgba(8a8a8aff)
    font_size = 11
    font_family = JetBrainsMono NF
    position = 0, 40
    halign = center
    valign = bottom
}
