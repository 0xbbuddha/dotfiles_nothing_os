; Nothing, for Spotify through spicetify.
;
; The same palette as the shell: matte black, concrete grey, and one red.
; Spotify's green is gone entirely, which is most of the work: it is the
; single colour that makes a themed client still look like Spotify.
;
; Two schemes, because the rice ships both looks. Switch with
;   spicetify config color_scheme light && spicetify apply

